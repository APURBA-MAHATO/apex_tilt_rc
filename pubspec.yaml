name: apex_tilt_rc
description: Cross-platform Flutter & Flame mobile app for Tilt RC Car Control and Arcade Racing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.35.0
  sensors_plus: ^7.1.1
  flutter_blue_plus: ^1.36.8
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.4
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
